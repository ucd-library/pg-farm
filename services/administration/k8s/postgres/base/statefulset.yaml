apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgfarm-instance
spec:
  selector:
    matchLabels:
      app:  
  serviceName: 
  template:
    metadata:
      labels:
        pgfarm-type: database
        app:
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: postgres
        image: pg
        args: ["-c", "max_connections=100", "-c", "shared_preload_libraries=pg_stat_statements,pg_cron"]
        imagePullPolicy: IfNotPresent
        env:
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "password"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        resources:
          limits:
            memory: "3Gi"
            cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "0.25"
        lifecycle:
          preStop:
            exec:
              command: ["pg_ctl", "stop", "-m", "fast", "-D", "/var/lib/postgresql/data/pgdata"]
        resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: NotRequired
        ports:
        - containerPort: 5432
        volumeMounts:
        - name:
          mountPath: /var/lib/postgresql/data
        - name: pg-socket
          mountPath: /var/run/postgresql
      - name: pg-helper
        image:
        args: ["npm", "run", "pg-helper"]
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
            # scratch space for downloading a backup file during restore, see /scratch
            # mount below. Sized for the largest expected single-database dump -
            # adjust per overlay if a larger DB needs more room.
            ephemeral-storage: "100Gi"
          requests:
            memory: "256Mi"
            cpu: "200m"
            ephemeral-storage: "100Gi"
        resizePolicy:
        - resourceName: cpu
          restartPolicy: NotRequired
        - resourceName: memory
          restartPolicy: NotRequired
        ports:
        - containerPort: 3000
        env:
        - name: LOG_LEVEL
          value: "info"
        - name : "GOOGLE_APPLICATION_CREDENTIALS"
          value : "/etc/google/service-account.json"
        # - name: METRICS_ENABLED
        #   value: "true"
        - name: SERVICE_NAME
          value: "pg-helper"
        volumeMounts:
        - name: pg-socket
          mountPath: /var/run/postgresql
        - name: service-account
          mountPath: /etc/google
        - name: scratch
          mountPath: /scratch
      volumes:
      - name: pg-socket
        emptyDir: {}
      - name: service-account
        secret:
          secretName: service-account
      # Ephemeral, not a PVC: only holds data for the lifetime of a restore (downloaded
      # then deleted immediately after pg_restore completes), so it costs nothing while
      # idle. sizeLimit should match the ephemeral-storage resource above.
      - name: scratch
        emptyDir:
          sizeLimit: 100Gi

  volumeClaimTemplates:
  - metadata:
      name: postgres-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi