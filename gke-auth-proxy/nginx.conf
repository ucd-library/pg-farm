events {}

http {
    server {
        listen 8080;

        allow 10.0.0.0/8;
        deny all;

        location / {
            proxy_pass https://auth.library.ucdavis.edu;
            proxy_ssl_server_name on;
            proxy_set_header Host auth.library.ucdavis.edu;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
